<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyShop - Responsive Navigation Bar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">MyShop</div>
    <button id="menu-btn" class="menu-btn" type="button" aria-label="Toggle navigation">&#9776;</button>
    <nav id="nav-menu" class="nav-menu">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="content">
    <h1>Welcome to MyShop</h1>
    <p>Resize the browser window or view on mobile to see the navigation bar switch between a horizontal row and a collapsible menu.</p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
